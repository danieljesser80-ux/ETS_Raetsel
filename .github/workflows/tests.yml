name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "change/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vollständige Test-Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: OFF-070 Testfolgenanalyse – vollständiges Dateiinventar
        run: node tools/off070-testfolgenanalyse.mjs
      - name: Vollständige Tests inklusive Datenbanktests
        run: npm test
