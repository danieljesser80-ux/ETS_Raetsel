<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <noscript>
      <meta http-equiv="refresh" content="5;url=index.html">
    </noscript>
    <title>falsch</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="card">
      <h1 class="error">falsch</h1>
      <p id="countdown" role="timer">Zurück zum Rätsel in 5 Sekunden.</p>
      <a class="button" href="index.html">Jetzt zurück</a>
    </main>
    <script>
      const countdown = document.getElementById("countdown");
      const deadline = Date.now() + 5000;
      const timer = window.setInterval(function () {
        const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        countdown.textContent = seconds === 1
          ? "Zurück zum Rätsel in 1 Sekunde."
          : "Zurück zum Rätsel in " + seconds + " Sekunden.";

        if (seconds === 0) {
          window.clearInterval(timer);
          window.location.replace("index.html");
        }
      }, 200);
    </script>
  </body>
</html>
